name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' | while read -r f; do
            cp "$f" "dist/ProxyShare-$(basename "$f")"
          done
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ProxyShare-apks
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
